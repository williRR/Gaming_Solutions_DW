server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compresión gzip para acelerar la carga de JS/CSS
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Manejo de rutas de una Single Page Application (React Router-ready):
    # cualquier ruta que no coincida con un archivo real se redirige
    # a index.html para que React maneje el enrutamiento en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash en el nombre (generados por Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cachear el index.html para que los usuarios siempre reciban
    # la última versión desplegada (evita servir un index.html viejo
    # que apunte a assets ya eliminados)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /index.html;
}
